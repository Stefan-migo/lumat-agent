# LumatAgent local dev environment (T1.3; design deployment step 1).
#
# Topology: api (uvicorn, repo bind-mounted) + db (pgvector, named volume).
# Named volumes: db (postgres data), media/ (WhatsApp media), backups/ (dumps).
# Secrets come from infra/.env (gitignored) — never from the repo (SH-2).
#
# Usage:
#   cp infra/.env.example infra/.env   # fill real values
#   docker compose -f infra/docker-compose.yml up --build
#   curl http://localhost:8000/health
#   docker compose -f infra/docker-compose.yml exec db psql -U lumat -d lumat
#
# Test profile (T6.1): the pgvector container the pytest suites run against
# (tests conftest DATABASE_URL). Bring it up with:
#   docker compose -f infra/docker-compose.yml --profile test up -d db-test

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: lumat
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumat -d lumat"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Test DB for the pytest suites (T6.1): pgvector on localhost:5432, same
  # credentials the tests conftests use (lumat/lumat admin, app/app role
  # created by db/migrate.sh). Started only with --profile test.
  #
  # Data lives in RAM (tmpfs), NOT a named volume. Why: the autouse `clean_db`
  # fixture TRUNCATEs 25 tables before EVERY test, and on a btrfs-backed host
  # that costs hundreds of milliseconds per test — one relfilenode create/unlink
  # + fsync per relation and index, independent of table size. tmpfs removes
  # essentially all of it (measured ~10x on the TRUNCATE itself).
  #
  # Nothing here needs to survive a container restart: `migrated_db` re-runs
  # db/migrate.sh once per pytest session, and migrate.sh is idempotent and
  # recreates the `app` role on a virgin cluster.
  db-test:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_USER: lumat
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-lumat}
      POSTGRES_DB: lumat
    ports:
      - "${TEST_DB_PORT:-5432}:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumat -d lumat"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ..:/app
      # .venv shadowed by a named volume: the container's `uv sync` builds its
      # own venv and NEVER clobbers the host's .venv (bind mount is read-write).
      - venv:/app/.venv
      - media:/app/media
      - backups:/app/backups
    environment:
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in infra/.env}
      VERIFY_TOKEN: ${VERIFY_TOKEN:?set VERIFY_TOKEN in infra/.env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in infra/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:?set META_ACCESS_TOKEN in infra/.env}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:?set META_PHONE_NUMBER_ID in infra/.env}
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET:?set PANEL_SESSION_SECRET in infra/.env}
      # Admin bootstrap (T7.2): consumed by db/seed.sh at deploy time inside
      # the container (`docker compose exec api db/seed.sh`) — never needed by
      # the running app, defaults are fine for dev (seed fails loudly if the
      # password is unset). Values live in infra/.env, never in the repo (SH-2).
      PANEL_ADMIN_USERNAME: ${PANEL_ADMIN_USERNAME:-admin}
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:-}
      # Chat LLM (D3 multi-provider): consumed at use time by llm.openai_client();
      # SMTP for notification email fallback. Optional at boot — the API starts
      # even when unset and fails fast only when the active provider is used.
      CHAT_PROVIDER: ${CHAT_PROVIDER:-deepseek}
      CHAT_MODEL: ${CHAT_MODEL:-deepseek-chat}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Panel assistant (AgentChat) provider is configured independently from
      # the WhatsApp chat provider. These MUST be forwarded here: without them
      # the container silently falls back to app/config.py defaults
      # (openrouter + google/gemini-2.5-flash) and the assistant answers 401
      # "Missing Authentication header" whenever OPENROUTER_API_KEY is a
      # placeholder — the keys in infra/.env never get a chance to apply.
      ASSISTANT_CHAT_PROVIDER: ${ASSISTANT_CHAT_PROVIDER:-deepseek}
      ASSISTANT_CHAT_MODEL: ${ASSISTANT_CHAT_MODEL:-deepseek-chat}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # migrate (idempotent) then serve; the migrate needs the admin URL
    # (psycopg direct, no SQLAlchemy) so it runs in a SUBSHELL — otherwise the
    # bare `DATABASE_URL=...` assignment would leak into uvicorn's environment
    # and make SQLAlchemy fall back to the psycopg2 dialect (crash: no module).
    #
    # --reload: the repo is bind-mounted, so without it the container keeps
    # serving whatever code was on disk when it started. A five-day-old process
    # once served a route set that predated a merged endpoint and answered 405,
    # which reads as a code bug and is not one. This file is dev-only —
    # infra/docker-compose.prod.yml has its own command and a built image with
    # no bind mount — so reload never reaches production.
    #
    # --timeout-graceful-shutdown: uvicorn's default is to wait forever for a
    # task that never finishes, and the failure is silent — the port keeps
    # accepting connections while nothing answers, which reads as an
    # application bug. One such leak (the panel WebSocket task, fixed in the
    # handler) cost a hung dev API until this flag's absence was understood.
    # Bounding the wait turns that class of bug into a five-second reload.
    command: >
      sh -c "uv sync --frozen &&
             (DATABASE_URL=postgresql://lumat:$$POSTGRES_PASSWORD@db:5432/lumat
              APP_DB_PASSWORD=$$APP_DB_PASSWORD db/migrate.sh) &&
             exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
                  --timeout-graceful-shutdown 5"

volumes:
  db:
  venv:
  media:
  backups:
