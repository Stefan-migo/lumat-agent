# Shared api upstream proxy settings — included from the location blocks of
# infra/nginx/*.conf. `proxy_pass` without a URI forwards the request path
# unchanged: the api serves /webhook/whatsapp, /health and /panel/* itself on
# port 8000 (internal `default` network, service name `api`).
proxy_pass http://api:8000;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
