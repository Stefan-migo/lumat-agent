# LumatAgent — agente.lumat.cl (bot API): WhatsApp webhook + health + panel.
#
# Mounted read-only into the nginx container (infra/docker-compose.prod.yml).
# TLS cert paths match the certbot volume layout (/etc/letsencrypt/live/...).
# A single certificate covers BOTH hostnames as SANs (certbot -d agente.lumat.cl
# -d panel.lumat.cl), so this block and panel.lumat.cl.conf read the same
# agente.lumat.cl live path.
#
# Local rehearsal without public DNS (T7.1 VM): place a SELF-SIGNED cert with
# both SANs at the same live paths — the server blocks are identical, only the
# cert source changes (see infra/certbot/README.md §3).

# HTTP -> HTTPS redirect; the Let's Encrypt webroot challenge is served
# BEFORE the redirect so certbot can validate on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name agente.lumat.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agente.lumat.cl;

    ssl_certificate     /etc/letsencrypt/live/agente.lumat.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agente.lumat.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 4h;

    # Security headers (HSTS, clickjacking, MIME sniffing, referrer).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Meta webhook: POST /webhook/whatsapp (HMAC signature gate) + GET verify
    # handshake. The proxy passes the URI unchanged; the api serves it on :8000.
    location /webhook/ {
        include /etc/nginx/conf.d/snippets/proxy-pass.conf;
    }

    # Ops health endpoint (monitor.sh probes this through TLS).
    location = /health {
        include /etc/nginx/conf.d/snippets/proxy-pass.conf;
    }

    # WebSocket: self-contained (NO proxy-pass snippet — it sets a plain-HTTP
    # Connection "" header and duplicate scalar directives would fail nginx -t).
    location = /panel/ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Admin panel on the bot host as well (dedicated host: panel.lumat.cl).
    location /panel/ {
        include /etc/nginx/conf.d/snippets/proxy-pass.conf;
    }
}
