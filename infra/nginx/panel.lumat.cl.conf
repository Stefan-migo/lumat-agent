# LumatAgent — panel.lumat.cl (admin panel, design D7).
#
# Serves the panel SPA and the explicit API, WebSocket, and CSV export routes.
#
# TLS: same certificate as agente.lumat.cl (SANs cover both names) — see the
# header of agente.lumat.cl.conf.

server {
    listen 80;
    listen [::]:80;
    server_name panel.lumat.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.lumat.cl;

    ssl_certificate     /etc/letsencrypt/live/agente.lumat.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agente.lumat.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 4h;
    root /usr/share/nginx/html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Canonical panel entry points.
    location = / {
        return 301 /panel/app/;
    }

    location = /panel/ {
        return 301 /panel/app/;
    }

    location = /panel/login {
        return 301 /panel/app/;
    }

    location = /panel/app {
        return 301 /panel/app/;
    }

    location = /panel/api {
        include /etc/nginx/conf.d/snippets/proxy-pass.conf;
    }

    location = /panel/ws {
        include /etc/nginx/conf.d/snippets/proxy-pass.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ^~ /panel/api/ {
        include /etc/nginx/conf.d/snippets/proxy-pass.conf;
    }

    location = /panel/export {
        include /etc/nginx/conf.d/snippets/proxy-pass.conf;
    }

    location ^~ /panel/export/ {
        include /etc/nginx/conf.d/snippets/proxy-pass.conf;
    }

    location = /panel/app/index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /panel/app/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /panel/app/ {
        try_files $uri $uri/ /panel/app/index.html;
    }

}
