# LumatAgent — panel.lumat.cl (admin panel, design D7).
#
# Serves the same /panel/* routes of the api upstream that agente.lumat.cl
# proxies. The panel templates generate absolute /panel/ URLs (base.html), so
# this host redirects its root to /panel/ and proxies the prefix unchanged.
#
# TLS: same certificate as agente.lumat.cl (SANs cover both names) — see the
# header of agente.lumat.cl.conf.

server {
    listen 80;
    listen [::]:80;
    server_name panel.lumat.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.lumat.cl;

    ssl_certificate     /etc/letsencrypt/live/agente.lumat.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agente.lumat.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 4h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Root -> panel prefix so the shared /panel/* links keep working.
    location = / {
        return 301 /panel/;
    }

    location /panel/ {
        include /etc/nginx/conf.d/snippets/proxy-pass.conf;
    }
}
