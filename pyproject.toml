[project]
name = "lumatagent"
version = "2026.10.13"
description = "LumatAgent — AI WhatsApp assistant for Lumat (gasfitería, Chile) and its operations panel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "langgraph>=0.2",
    "langchain-text-splitters>=0.2",
    "openai>=1.40",
    "pypdf>=4.3",
    "httpx>=0.27",
    "cryptography>=42",
    "fastembed>=0.3",
    # Panel stack (design D7): Jinja2 templates, signed-cookie sessions,
    # bcrypt password hashing (AP-1). itsdangerous is Starlette's cookie
    # signer; python-multipart parses the login/upload forms.
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pywebpush>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

# A test that hangs had no ceiling or diagnosis: the suite stalls
# intermittently, unrelated to the code under test. 120s is ~200x the ~0.6s
# per-test average, so it cannot flake on a slow machine; `thread` is the only
# method that guarantees the ceiling (it hard-exits even when a C-level call
# swallows SIGALRM) and it dumps the hanging MainThread stack.
timeout = 120
timeout_method = "thread"

markers = [
    "spec: OpenSpec requirement scenario, e.g. @pytest.mark.spec('WH-5')",
    "integration: integration tests against real or mocked external systems",
    "functional: end-to-end functional flows",
    "injection: prompt-injection test suite",
]
