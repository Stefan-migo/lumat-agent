[project]
name = "lumatagent"
version = "0.1.0"
description = "LumatAgent — AI WhatsApp assistant for Lumat (gasfitería, Chile). Hito 1: setup + WhatsApp operativo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "langgraph>=0.2",
    "langchain-text-splitters>=0.2",
    "openai>=1.40",
    "pypdf>=4.3",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "spec: OpenSpec requirement scenario, e.g. @pytest.mark.spec('WH-5')",
    "integration: integration tests against real or mocked external systems",
    "functional: end-to-end functional flows",
    "injection: prompt-injection test suite",
]
