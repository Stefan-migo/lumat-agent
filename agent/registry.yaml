# registry.yaml — declarative agent registry and assistant runtime config.
agent:
  name: orchestrator
  persona: personas/orchestrator.md
  skills: [sdb, emergency, handoff, capture]
  tools_whitelist: []
  memoria_scope: null
  model: deepseek-chat
# H2 multi-agent roster (AO-1). The `agent:` block above is IN TACT (AC-4);
# `sub_agents:` is a NEW sibling key. Each sub-agent declares all six fields:
# name / persona / tools_whitelist / memoria_scope / model /
# temperature. Only research_triage has runtime wiring in slice 1; the other
# four are data-only (declared, no runtime behavior).
sub_agents:
  research_triage:
    name: kb-research-triage
    persona: personas/research_triage.md
    tools_whitelist: ["kb.retrieve"]
    memoria_scope: "customer"
    model: deepseek-chat
    temperature: 0
  retrieval:
    name: kb-retrieval
    persona: personas/retrieval.md
    tools_whitelist: ["kb.retrieve"]
    memoria_scope: "customer"
    model: deepseek-chat
    temperature: 0
  customer_records:
    name: customer-records
    persona: personas/customer_records.md
    tools_whitelist: []
    memoria_scope: "customer"
    model: deepseek-chat
    temperature: 0
  human_handoff:
    name: human-handoff
    persona: personas/human_handoff.md
    tools_whitelist: []
    memoria_scope: "customer"
    model: deepseek-chat
    temperature: 0
  escalation:
    name: escalation
    persona: personas/escalation.md
    tools_whitelist: []
    memoria_scope: "customer"
    model: deepseek-chat
    temperature: 0
assistant:
  name: assistant
  persona: personas/assistant.md
  skills: []
  prompts:
    plan: prompts/assistant_plan.md
    respond: prompts/assistant_respond.md
    classify: prompts/assistant_classify.md
  tools_whitelist:
    - customers.search
    - customers.list
    - conversations.search
    - conversations.list
    - appointments.upcoming
    - cases.list
    - kb.retrieve
    - memory.read
    - memory.search
    - memory.write
    - dashboard.summary
    - web.search
    - automation.create_rule
    - project.list
    - project.find
    - project.create
    - project.rename
    - project.archive
    - project.merge
    - assistant.capabilities
  memoria_scope: panel
  model: deepseek-chat
  sdb_classification:
    field: classification
    allowed: [normal, sdb]
  cortex_session:
    classes: [question, research, decision, continue, close]
    commands: ["/planning <topic>", "/planning close"]
