# registry.yaml — declarative agent registry and assistant runtime config.
agent:
  name: orchestrator
  persona: personas/orchestrator.md
  skills: [emergency, handoff, capture]
  tools_whitelist: []
  memoria_scope: null
  model: deepseek-chat
# H2 multi-agent roster (AO-1). The `agent:` block above is IN TACT (AC-4);
# `sub_agents:` is a NEW sibling key. Each sub-agent declares all six fields:
# name / persona / tools_whitelist / memoria_scope / model /
# temperature. research_triage has runtime wiring. customer_records is resolved
# and validated by panel guardrails, but has no executable delegation span yet.
# The remaining three sub-agents are data-only.
sub_agents:
  research_triage:
    name: kb-research-triage
    persona: personas/research_triage.md
    tools_whitelist: ["kb.retrieve"]
    memoria_scope: "customer"
    model: deepseek-chat
    temperature: 0
  retrieval:
    name: kb-retrieval
    persona: personas/retrieval.md
    tools_whitelist: ["kb.retrieve"]
    memoria_scope: "customer"
    model: deepseek-chat
    temperature: 0
  customer_records:
    name: customer-records
    persona: personas/customer_records.md
    tools_whitelist:
      - customers.search
      - conversations.search
      - appointments.upcoming
      - cases.list
      - customers.operational_history
      - memory.read
      - memory.search
    memoria_scope: "customer"
    model: deepseek-chat
    temperature: 0
  human_handoff:
    name: human-handoff
    persona: personas/human_handoff.md
    tools_whitelist: []
    memoria_scope: "customer"
    model: deepseek-chat
    temperature: 0
  escalation:
    name: escalation
    persona: personas/escalation.md
    tools_whitelist: []
    memoria_scope: "customer"
    model: deepseek-chat
    temperature: 0
assistant:
  name: assistant
  persona: personas/assistant.md
  skills:
    - name: memoria-tukulpan
      description: "Tukulpan memory: own vs customer axis, when to read/write, and correct memory.* argument shapes."
      path: skills/assistant/memoria-tukulpan.md
    - name: tools
      description: "Assistant tools: default vs opt-in tiers, owner approval for writes, and multi-turn/partial-read usage."
      path: skills/assistant/tools.md
    - name: kb
      description: "Knowledge base: when and how to use kb.retrieve and how to stay grounded."
      path: skills/assistant/kb.md
  prompts:
    plan: prompts/assistant_plan.md
    respond: prompts/assistant_respond.md
  tools_whitelist:
    - customers.search
    - customers.list
    - conversations.search
    - conversations.list
    - appointments.upcoming
    - cases.list
    - customers.operational_history
    - kb.retrieve
    - memory.read
    - memory.search
    - memory.write
    - memory.update
    - memory.delete
    - dashboard.summary
    - analytics.chatbot_metrics
    - analytics.chatbot_conversations
    - conversations.transcript
    - settings.update
    - web.search
    - web.fetch
    - automation.create_rule
    - project.list
    - project.find
    - list_project_files
    - read_project_file
    - view_image
    - skill.propose
    - artifact.save
    - project.create
    - project.rename
    - project.archive
    - project.merge
    - assistant.capabilities
  memoria_scope: panel
  model: deepseek-chat
# S9: role-selected agents. The `assistant:` block above stays the default;
# a role listed here talks to its own agent (persona/prompts/skills/tools/
# memoria_scope). The role gate (ROLE_TOOL_ALLOWLIST) still bounds every tool.
role_agents:
  tecnico:
    name: TecnicoLumat
    persona: personas/tecnico_lumat.md
    prompts:
      plan: prompts/assistant_plan.md
      respond: prompts/assistant_respond.md
    skills:
      - name: kb
        description: "Knowledge base: when and how to use kb.retrieve and how to stay grounded."
        path: skills/assistant/kb.md
      - name: tools
        description: "Assistant tools: default vs opt-in tiers, owner approval for writes, and multi-turn/partial-read usage."
        path: skills/assistant/tools.md
    tools_whitelist:
      - assistant.capabilities
      - kb.retrieve
      - appointments.upcoming
      - memory.read
      - memory.search
      - memory.write
      - memory.update
      - memory.delete
      - artifact.save
      - web.search
      - web.fetch
      - project.list
      - project.find
    memoria_scope: panel
    model: deepseek-chat
