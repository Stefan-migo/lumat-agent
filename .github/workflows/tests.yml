name: Tests

# The suite is the release gate. Before this workflow the only gate was a human
# remembering to run ~1000 tests by hand.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Pinned, not `ubuntu-latest`: on 2026-11-06 the `latest` image for this job had
    # no ffmpeg, the guarded install spent 14 minutes in `apt-get` and the job was
    # cancelled at its limit without running a single test. A gate cannot depend on
    # whichever image `latest` resolves to that day.
    runs-on: ubuntu-24.04
    # 20, not 15: the ffmpeg install shares this budget with the suite and the
    # mirror's speed is not ours. The install itself is bounded below, so a hang
    # fails with a readable message instead of eating the job. The budget has to cover `uv sync`, the apt
    # install below and the suite, and on 2026-11-04 three `test` jobs were
    # cancelled at 10 minutes while still inside `apt-get install ffmpeg` — the
    # required check failing for a reason the diff had nothing to do with, and
    # every one of those reruns then passed in about five minutes.
    timeout-minutes: 20
    env:
      # Disposable localhost credentials for a throwaway container — not project
      # secrets, so no repository secret is wired.
      TEST_DB_PORT: 5432
      TEST_POSTGRES_PASSWORD: ci-throwaway
      # Mirrors what `infra/test-db.sh env` exports for a local run, which CI
      # cannot call (it requires the gitignored infra/.env). Without this the
      # suite reuses DATABASE_URL — the app role — for its migrations, which then
      # cannot create the extension or the role: every DB-backed test errors.
      TEST_ADMIN_DB_URL: postgresql://lumat:ci-throwaway@localhost:5432/lumat
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumat
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: lumat
        ports:
          - 5432:5432
        # tmpfs: the suite TRUNCATEs 25 tables before every test, and this
        # disposable database never needs to survive the container.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U lumat -d lumat"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      # python-version pins the interpreter the production image runs
      # (Dockerfile: python3.14-bookworm-slim); uv installs and manages it.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      # app/services/audio_format.py shells out to ffmpeg to remux a Chromium recording into the
      # ogg/opus container Meta requires, and the production image installs it for the same reason.
      # Stated here instead of relying on the runner image carrying it — but installed only when the
      # image does not already have it, so a run does not pay two minutes of apt for nothing and, more
      # importantly, does not spend part of its budget on the step that kept cancelling the job.
      # The runner image does not reliably ship ffmpeg: measured on 2026-11-06, one run
      # found it and installed nothing (21 s), another had no ffmpeg and the download of
      # ~60 MB of packages ran past its bound twice. So the packages are cached and the
      # install only happens on a cold cache.
      - uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-ffmpeg-ubuntu-24.04-v1
      # Bounded: a hang must fail this step with a readable message, not consume the
      # job's budget and report `cancelled` while the suite never ran.
      - run: command -v ffmpeg || (timeout 600 bash -c 'sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg')
      - run: ffmpeg -version | head -1
      - run: uv run pytest tests/

  # The panel gate. `uv run pytest` only covers the Python side, so a TypeScript
  # error can land with every check green — including one produced by the merge
  # itself, which git merges textually clean and GitHub reports as "CLEAN". This
  # job is the only thing that type-checks the frontend.
  #
  # Order matters: `build` (tsc -b) is the cheap type check and fails fast, so it
  # runs before the slower behavioural suite. `npm ci` is deliberate — unlike a
  # bare install it fails when package.json and the lockfile disagree, instead of
  # silently rewriting the lockfile.
  #
  # Suite stability: heavy page-component suites (ClientFicha, ConversationsList)
  # used to time out under parallel load and flake the run non-deterministically.
  # The vitest per-test timeout is now 15s (web/vite.config.ts) to absorb that.
  # If it flakes again, lower vitest concurrency or harden the slow suite —
  # never delete it.
  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # web/package.json pins engines.node 22.22.2; match it so the gate runs the
      # interpreter the project declares rather than whatever `latest` resolves to.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
