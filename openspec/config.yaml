schema: spec-driven

context: |
  Project: LumatAgent — AI WhatsApp assistant for Lumat (gasfitería, Chile)
  Phase: Software delivery — Hito 1 (Setup + WhatsApp operativo) active; contract signed 2026-08-07, Pago 1 received 2026-08-11, kickoff 2026-08-17
  Stack: Hostinger KVM 2 (São Paulo) + Ubuntu LTS + Docker Compose + PostgreSQL/pgvector + Python FastAPI/LangGraph
  Structure: Single milestone active (M1/Hito 1: Setup + WhatsApp operativo). M2 (web) on standby. M3 (payments) out of scope. One SDD change per hito (4 changes total); 12 weeks construction + 5 weeks testing, acceptance ~16-dic-2026.
  Existing: shipped FastAPI/LangGraph application and React/Vite panel with Python, Vitest, and Playwright test coverage

rules:
  proposal:
    - Keep scope tight to H1: no H2-H4 features (multi-agent orchestration, reply-from-panel inbox, calendar/ICS, notifications, automations/event bus, PWA, advanced dashboards), no M2 web, no M3 payments
    - Technical artifacts in English; client-facing docs in Spanish (separate deliverable)
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows (webhook ingest, handoff, emergency)
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "uv run pytest tests/"
  verify:
    test_command: "uv run pytest tests/"
    build_command: "cd web && npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  detected: "2026-08-12"
  runner: pytest (active from B1, strict TDD)
  layers:
    unit: true
    integration: true
    e2e: true
  coverage: false
  quality:
    linter: false
    type_checker: false
    formatter: false
  notes: "Measured suites: 16 unit, 45 integration, 23 functional, 1 injection, and 6 spec Python files; 77 Vitest files under web/src; 1 Playwright spec under web/playwright. No linter, type checker, or formatter is configured in pyproject.toml or web/; npm run build type-checks through tsc -b only."
