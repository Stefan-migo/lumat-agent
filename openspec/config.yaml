schema: spec-driven

context: |
  Project: LumatAgent — AI WhatsApp assistant for Lumat (gasfitería, Chile)
  Contract: signed 2026-08-07; Pago 1 received 2026-08-11; kickoff 2026-08-17; acceptance ~16-dic-2026
  Client milestones (contract; source of truth: LumatRequest.md): M1 bot IA de atención al cliente, captura de datos, orientación inicial, derivación y administración; M2 public Lumat website (services, contact, forms, bot connection); M3 service catalog, scheduling, customer base, payments, operational automation
  Delivery state: the four internal delivery hitos are shipped and archived under openspec/changes/archive/ — Hito 1 (setup + WhatsApp operativo), Hito 2 (human inbox), Hito 3 (scheduling + notifications), Hito 4 (automations + chat PWA). Hito 1's two remaining tasks are operational and blocked on the client, not on code: Meta Cloud API onboarding (T2.1) and go-live on the dedicated number (T7.3). Delivery hitos are internal and do not map one-to-one onto the contract milestones.
  Stack: Hostinger KVM 2 (São Paulo) + Ubuntu LTS + Docker Compose + PostgreSQL/pgvector + Python FastAPI/LangGraph + React/Vite
  Existing: shipped FastAPI/LangGraph application and React/Vite operations panel (`web/` — a panel, not the contract's M2 public website) with Python, Vitest, and Playwright test coverage

rules:
  proposal:
    - Scope each proposal to the change actually requested; do not revive shipped Hito 1–4 capabilities, and do not expand into the contract's M2/M3 scope without an explicit request
    - Technical artifacts in English; client-facing docs in Spanish (separate deliverable)
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows (webhook ingest, handoff, emergency)
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    # Tiered verification policy: AGENTS.md -> "Test tiers", executed by
    # scripts/test.sh. Iteration is the cheap gate; the full suite is the
    # closure gate (verify.test_command) and stays authoritative.
    test_command: "bash scripts/test.sh quick"
  verify:
    test_command: "bash scripts/test.sh full"
    build_command: "cd web && npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  detected: "2026-08-12"
  runner: pytest (active from B1, strict TDD)
  layers:
    unit: true
    integration: true
    e2e: true
  coverage: false
  quality:
    linter: false
    type_checker: false
    formatter: false
  notes: "Measured 2026-10-23: 2822 collected tests across 64 unit, 94 integration, 43 functional, 5 spec, and 1 injection Python files; 111 Vitest files under web/src; 2 Playwright specs under web/playwright. Tiered verification (AGENTS.md -> 'Test tiers', scripts/test.sh): gate ~7s / unit ~14s / quick ~19s / full ~413s. No linter, type checker, or formatter is configured in pyproject.toml or web/; npm run build type-checks through tsc -b only."
